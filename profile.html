{% extends "base.html" %}
{% block title %}Profile{% endblock %}
{% block content %}
<div class="container py-5"><div class="row g-4"><div class="col-lg-5"><div class="stat-card"><i class="bi bi-person-circle display-6"></i><h3 class="mt-3">{{ user.username }}</h3><p class="text-muted mb-1">{{ user.email }}</p><span class="badge bg-primary">{{ user.profile.get_role_display }}</span></div></div>
<div class="col-lg-7"><div class="card-soft p-4"><h4>Profile information</h4><form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary">Save changes</button></form></div></div></div></div>
{% endblock %}
